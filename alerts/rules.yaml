apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-alerts
  namespace: monitoring
  labels:
    release: monitoring          # same reason as the ServiceMonitor: Prometheus only loads labelled rules
spec:
  groups:
  - name: demo-app
    rules:
    - alert: DemoAppHighErrorRate
      expr: |
        sum(rate(http_requests_total{job="demo-app", status=~"4xx|5xx"}[5m]))
        /
        sum(rate(http_requests_total{job="demo-app"}[5m]))
        > 0.05
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "demo-app error rate above 5%"
        description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

    - alert: DemoAppPodsUnavailable
      expr: |
        kube_deployment_status_replicas_available{namespace="default", deployment="demo-app"}
        <
        kube_deployment_spec_replicas{namespace="default", deployment="demo-app"}
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "demo-app has fewer pods running than desired"
