# kube-prometheus-stack 91.8.1
# Install/upgrade:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 91.8.1 -n monitoring --create-namespace -f helm/values/prometheus.yaml
#
# Memory sized from real usage (max working set over 1 day, Nov 2026):
# request ≈ normal usage, limit ≈ 2x headroom.
# No CPU limits — they cause throttling; requests are enough for scheduling.

prometheus:
  prometheusSpec:
    retention: 7d                 # lab cluster, keep disk small (default 10d)
    resources:                    # used ~285Mi
      requests: { cpu: 100m, memory: 400Mi }
      limits:   { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:                    # used ~50Mi
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { memory: 128Mi }

grafana:
  resources:                      # used ~320–420Mi
    requests: { cpu: 50m, memory: 384Mi }
    limits:   { memory: 768Mi }
  sidecar:
    resources:                    # dashboard + datasource sidecars, ~75Mi each
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { memory: 128Mi }

prometheusOperator:
  resources:                      # used ~80Mi
    requests: { cpu: 20m, memory: 96Mi }
    limits:   { memory: 192Mi }

kube-state-metrics:
  resources:                      # used ~50Mi
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { memory: 128Mi }

prometheus-node-exporter:
  resources:                      # used ~10–27Mi
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { memory: 64Mi }
